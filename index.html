<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento de Campo</title>
<meta name="author" content="Wendel Emílio de Souza Matias — oficial.respostas@gmail.com">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Identidade Guardião (guardiaoseg.com.br): preto, dourado e vermelho, tema escuro único.
   Layout: app de campo para celular — cabeçalho preto, etapas numeradas, barra fixa de ação embaixo; painel do gestor com indicadores */
:root{
  --bg:#0a0a0c; --surface:#141416; --surface-2:#1c1c1f; --ink:#eae7e0; --muted:#9a9aa1; --line:#2a2a2e;
  --navy:#0a0a0c; --navy-ink:#eae7e0; --accent:#d4af37; --accent-deep:#b8941f; --accent-ink:#0a0a0c; --red:#c81e1e;
  --ok:#3fbf76; --warn:#f08c2e; --bad:#ef5350; --info:#5aa8ea; --neg:#b08ae6;
  --display:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --body:"Work Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand h1{font-size:1.6rem;line-height:1.05;text-transform:uppercase;letter-spacing:.04em}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand small{opacity:.75;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:transparent;border:1px solid color-mix(in srgb,var(--navy-ink) 35%,transparent);color:var(--navy-ink);border-radius:8px;padding:7px 12px;font-size:.9rem;cursor:pointer}
.tbtn:hover{background:color-mix(in srgb,var(--navy-ink) 12%,transparent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stripe{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}

.steps{display:flex;gap:6px;overflow-x:auto;padding-block:14px 6px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;font-size:.88rem;color:var(--muted);white-space:nowrap}
.step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-family:var(--display);font-size:.95rem;color:var(--ink)}
.step.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.step.on b{background:var(--accent);color:var(--accent-ink)}

main{padding-block:14px 24px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head h2{font-size:1.9rem;text-transform:uppercase;letter-spacing:.03em}
.head p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3,.cat > h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel > p,.nota{margin:0;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=datetime-local],input[type=month],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
textarea.code{font-family:var(--mono);font-size:.78rem;min-height:260px;white-space:pre}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.95rem;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.navy{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cat{display:flex;flex-direction:column;gap:8px}
.cat > h3{margin-top:4px}
.item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.item.sel{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.item .ih{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.item .ih input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600}
.item .nm span{font-size:.82rem;color:var(--muted)}
.item .lt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.item .ib{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:0 14px 14px}
.item .ib .full{grid-column:1/-1}
@media (min-width:600px){.item .ib{grid-template-columns:110px 160px 1fr}.item .ib .full{grid-column:auto}.item .ib .wide{grid-column:1/-1}}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.est{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.est .en{font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:var(--surface-2);padding:8px 10px;font-size:.86rem;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.bom{background:var(--ok);color:#fff}
.seg button.on.reparo{background:var(--warn);color:#fff}
.seg button.on.nao{background:var(--bad);color:#fff}
.est .ex{display:grid;grid-template-columns:90px 1fr;gap:10px}

.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.foto{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.foto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
.foto .ph{width:100%;aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
.foto .fb{padding:10px;display:flex;flex-direction:column;gap:8px}
.add{border:2px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;min-height:180px;cursor:pointer;color:var(--muted);text-align:center;padding:16px;background:var(--surface)}
.add:hover{border-color:var(--accent);color:var(--ink)}
.add strong{font-family:var(--display);font-size:1.3rem;display:block;color:var(--ink)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{border-top:2px solid var(--ink);font-weight:600}
.totals{display:flex;flex-direction:column;gap:4px;margin-left:auto;min-width:min(100%,300px)}
.totals div{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.totals .big{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-family:var(--display);font-size:1.5rem}

.lev{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);border-left:5px solid var(--line)}
.lev.s-visitar{border-left-color:var(--info)} .lev.s-enviado{border-left-color:var(--warn)} .lev.s-negociacao{border-left-color:var(--neg)}
.lev.s-fechado{border-left-color:var(--ok)} .lev.s-perdido{border-left-color:var(--bad)} .lev.s-rep{border-left-color:var(--accent)}
.lev .lt1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lev .lt1 b{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;min-width:0}
.num{font-family:var(--mono);font-size:.82em}
.lev .meta{color:var(--muted);font-size:.86rem}
.lev .info{font-size:.92rem;font-variant-numeric:tabular-nums}
.lev details{font-size:.85rem;color:var(--muted)}
.lev details ul{margin:6px 0 0;padding-left:18px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-visitar{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.p-levantamento{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-enviado{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-negociacao{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.p-fechado{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.p-perdido{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.alerta{color:var(--bad);font-weight:600}
.atencao{color:var(--warn);font-weight:600}
.bom{color:var(--ok);font-weight:600}
.nuvem{display:inline-flex;align-items:center;gap:6px}
.nuvem i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.nuvem.ok i{background:var(--ok)} .nuvem.pend i{background:var(--accent)} .nuvem.off i{background:var(--warn)} .nuvem.erro i{background:var(--bad)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--muted)}
div.tile{cursor:default}
.tile small{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--display);font-size:2.3rem;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.tile span{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.t-info b{color:var(--info)} .tile.t-warn b{color:var(--warn)} .tile.t-bad b{color:var(--bad)} .tile.t-ok b{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-wrap:nowrap}
.chips.wrapl{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;color:var(--muted)}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chipb.pac{border-color:var(--accent-deep);color:var(--ink)}

/* Calculadora, assinatura, metas e gráfico */
.calc td,.calc th{padding:6px 4px}
.calc .preco{font-family:var(--display);font-size:1.8rem;color:var(--accent)}
.sig{width:100%;height:auto;aspect-ratio:3/1;background:#fff;border-radius:8px;border:2px dashed var(--accent-deep);touch-action:none;cursor:crosshair;display:block}
.sigimg{background:#fff;border-radius:8px;max-width:100%;max-height:150px;display:block}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog i.ok{background:var(--ok)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)} .chart .bar.cur{fill:var(--ok)}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart text.v{fill:var(--ink);font-weight:600}
.chart line{stroke:var(--line)}
.gps{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.tam{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);min-height:54px;min-width:0}
.tam.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tam label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;font-size:.93rem}
.tam label input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.tam .tq{display:flex;align-items:center;gap:6px;flex:none}
.tam .tq input{width:88px;padding:7px 8px;font-variant-numeric:tabular-nums}
.tam .tq span{color:var(--muted);font-size:.82rem;min-width:18px}
.tam .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.15rem;line-height:1;padding:4px}
.tam .x:hover{color:var(--bad)}
.lista-cfg .row{justify-content:space-between;border-bottom:1px solid var(--line);padding-block:6px}

.empty{text-align:center;padding:28px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.empty strong{display:block;font-family:var(--display);font-size:1.3rem;color:var(--ink);margin-bottom:4px}
ol.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
ol.passos b{color:var(--accent)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.bar .grow{flex:1;min-width:0;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal .box.larga{max-width:620px}
.modal .box h3{font-size:1.35rem}
.modal .box p{margin:0;color:var(--muted);white-space:pre-line}
.modal .col{display:flex;flex-direction:column;gap:8px}
.modal .col .btn{justify-content:flex-start;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
footer.cred{color:var(--muted);font-size:.78rem;text-align:center;padding-block:8px 20px}
@media (prefers-reduced-motion:no-preference){.item,.step,.tile{transition:border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><h1>Orçamento <em>de Campo</em></h1><small id="sub">Levantamento de necessidades e proposta de valores</small></div>
  <div class="topbtns" id="topbtns"></div>
</div></div>
<div class="stripe"></div>
<div class="wrap" id="stepsWrap"></div>
<main class="wrap" id="main"></main>
<footer class="cred wrap">Desenvolvido por Wendel Emílio de Souza Matias · oficial.respostas@gmail.com</footer>
<div class="bar"><div class="wrap" id="bar"></div></div>

<script>
'use strict';
/* =========================================================
   Orçamento de Campo — Guardião Serviços de Qualidade
   Desenvolvido por Wendel Emílio de Souza Matias
   oficial.respostas@gmail.com
   ========================================================= */

// =========================================================
// 1. Dados fixos
// =========================================================
const CATALOGO = [
  { cat: 'Portaria e recepção', itens: [
    ['port24',  'Portaria 24 horas (escala 12x36)', 'posto', 'mensal'],
    ['portDia', 'Porteiro diurno 12h (12x36)', 'posto', 'mensal'],
    ['portNoi', 'Porteiro noturno 12h (12x36)', 'posto', 'mensal'],
    ['recep',   'Recepcionista (44h semanais)', 'profissional', 'mensal'],
    ['folg',    'Folguista / cobertura de folgas', 'profissional', 'mensal']
  ]},
  { cat: 'Vigia e segurança patrimonial', itens: [
    ['vigNoi',  'Vigia noturno (12x36)', 'posto', 'mensal'],
    ['vigDia',  'Vigia diurno (12x36)', 'posto', 'mensal'],
    ['ronda',   'Ronda motorizada periódica', 'mês', 'mensal'],
    ['acesso',  'Controle de acesso de visitantes e prestadores', 'mês', 'mensal'],
    ['evento',  'Vigia para evento', 'diária', 'avulso']
  ]},
  { cat: 'Limpeza e conservação', itens: [
    ['limp44',  'Auxiliar de limpeza (44h semanais)', 'profissional', 'mensal'],
    ['zel',     'Zelador', 'profissional', 'mensal'],
    ['diar',    'Diarista de limpeza', 'diária', 'avulso'],
    ['jard',    'Jardinagem e roçagem', 'mês', 'mensal'],
    ['pisc',    'Manutenção de piscina', 'mês', 'mensal'],
    ['posobra', 'Limpeza pós-obra', 'serviço', 'avulso'],
    ['mat',     'Fornecimento de material de limpeza', 'mês', 'mensal']
  ]},
  { cat: 'Consultoria e tecnologia', itens: [
    ['risco',   'Análise de risco com relatório', 'serviço', 'avulso'],
    ['monit',   'Monitoramento de câmeras', 'mês', 'mensal'],
    ['instCam', 'Instalação de câmeras', 'câmera', 'avulso'],
    ['trein',   'Treinamento de equipe', 'turma', 'avulso']
  ]}
];
const ITEM_MAP = {};
CATALOGO.forEach(c => c.itens.forEach(i => { ITEM_MAP[i[0]] = { id: i[0], nome: i[1], unidade: i[2], tipo: i[3], cat: c.cat }; }));

// Calculadora de posto
const FUNCOES = { porteiro: 'Porteiro', vigia: 'Vigia', limpeza: 'Auxiliar de limpeza', recepcao: 'Recepcionista', zelador: 'Zelador' };
const ESCALAS = {
  '24h':   { t: '24 horas (12x36)',    dia: 2, noite: 2, dias: 15 },
  dia12:   { t: 'Diurno 12h (12x36)',  dia: 2, noite: 0, dias: 15 },
  noite12: { t: 'Noturno 12h (12x36)', dia: 0, noite: 2, dias: 15 },
  h44:     { t: '44 horas semanais',   dia: 1, noite: 0, dias: 22 }
};
const POSTO = { port24: ['porteiro', '24h'], portDia: ['porteiro', 'dia12'], portNoi: ['porteiro', 'noite12'], recep: ['recepcao', 'h44'], folg: ['porteiro', 'h44'],
  vigNoi: ['vigia', 'noite12'], vigDia: ['vigia', 'dia12'], limp44: ['limpeza', 'h44'], zel: ['zelador', 'h44'] };

}

const DB = {
  db: null, mem: { levs: new Map(), cfg: new Map() },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('orcamento-de-campo', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('levs', { keyPath: 'id' }); d.createObjectStore('cfg'); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  async all() { if (!this.db) return [...this.mem.levs.values()]; return this.tx('levs', 'readonly', s => s.getAll()); },
  async put(l) { if (!this.db) { this.mem.levs.set(l.id, l); return; } return this.tx('levs', 'readwrite', s => s.put(l)); },
  async del(id) { if (!this.db) { this.mem.levs.delete(id); return; } return this.tx('levs', 'readwrite', s => s.delete(id)); },
  async limpar() { if (!this.db) { this.mem.levs.clear(); return; } return this.tx('levs', 'readwrite', s => s.clear()); },
  async get(k) { if (!this.db) return this.mem.cfg.get(k); return this.tx('cfg', 'readonly', s => s.get(k)); },
  async set(k, v) { if (!this.db) { this.mem.cfg.set(k, v); return; } return this.tx('cfg', 'readwrite', s => s.put(v, k)); }
};

function calcPosto(funcao, escala, c = cfg.custos) {
  const e = ESCALAS[escala]; const sal = num(c.salarios[funcao]);
  const adicNoite = sal * num(c.noturno) / 100 * (num(c.horasNoturnas) / 12);
  const pessoa = noite => {
    const base = sal + (noite ? adicNoite : 0); const enc = base * num(c.encargos) / 100;

const nuvem = { estado: 'aguardando' };
function salvar(rapido) {

    try { lev.pendente = true; await DB.put(lev); const i = levs.findIndex(x => x.id === lev.id); if (i < 0) levs.push(lev); else levs[i] = lev; setStatus('Salvo no aparelho'); agendarEnvio(); }

}
async function gravar(l) { l.atualizadoEm = Date.now(); l.pendente = true; await DB.put(l); const i = levs.findIndex(x => x.id === l.id); if (i < 0) levs.push(l); else levs[i] = l; agendarEnvio(); }

let envioTimer = null, sincronizando = false, deNovo = false;
function agendarEnvio() { clearTimeout(envioTimer); envioTimer = setTimeout(() => sincronizar(false), 1500); pintaNuvem(); }
function paraNuvem(l) {
  const c = JSON.parse(JSON.stringify(l));
  c.fotos = (c.fotos || []).map(f => ({ id: f.id, w: f.w, h: f.h, legenda: f.legenda || '', em: f.em || null, gps: f.gps || null }));

}
async function enviarLev(l) {
  const marca = l.atualizadoEm;
  if (l.excluido) {
    for (const f of l.fotos) { try { await FB.req('DELETE', 'orc_fotos/' + f.id); } catch (e) {} }
  } else {
    for (const f of l.fotos) if (!f.nuvem && f.data) {
      await FB.req('PATCH', 'orc_fotos/' + f.id, { fields: { lev: { stringValue: l.id }, repUid: { stringValue: l.repId || '' }, data: { stringValue: f.data } } });
      f.nuvem = true;
    }
    for (const id of (l.fotosApagar || [])) { try { await FB.req('DELETE', 'orc_fotos/' + id); } catch (e) {} }
    l.fotosApagar = [];
  }
  await FB.req('PATCH', 'orc_levantamentos/' + l.id, paraNuvem(l));
  if (l.atualizadoEm === marca) l.pendente = false;
  if (l.excluido) l.fotos = l.fotos.map(f => ({ id: f.id }));

async function enviarCfg() {

  const marca = cfg.atualizadoEm;
  await FB.req('PATCH', 'orc_config/principal', { fields: { dados: { stringValue: JSON.stringify(c) }, atualizadoEm: { integerValue: String(cfg.atualizadoEm || 0) } } });

}
async function puxarNuvem() {
  let mudou = false;
  // representantes
  if (souGestor()) {
    const docs = await FB.listar('orc_reps');
    const novos = docs.map(d => Object.assign({ uid: idDoc(d) }, deCampos(d.fields)));
    if (JSON.stringify(novos) !== JSON.stringify(reps)) { reps = novos; await DB.set('reps', reps); mudou = true; }
  } else if (souRep()) {
    const d = await FB.req('GET', 'orc_reps/' + sessao.uid);
    const eu = d ? deCampos(d.fields) : null;
    if (!eu || eu.ativo !== true) { await forcarSaida('Seu acesso foi desativado pelo gestor.'); return false; }
    eu.uid = sessao.uid; reps = [eu];
    if (sessao.nome !== eu.nome) { sessao.nome = eu.nome; gravarSessao(); mudou = true; }
  }
  // orçamentos
  const docs = souGestor() ? await FB.listar('orc_levantamentos') : await FB.consultar('orc_levantamentos', 'repUid', sessao.uid);
  const lista = []; docs.forEach(d => { try { lista.push(JSON.parse(d.fields.dados.stringValue)); } catch (e) {} });
  const ids = new Set(lista.map(c => c && c.id));

    if (!c || !c.id) continue;
    const local = levs.find(x => x.id === c.id);
    if (local && (local.atualizadoEm || 0) >= (c.atualizadoEm || 0)) continue;
    if (local && view === 'editor' && lev && lev.id === c.id) {
      ['status', 'historico', 'contrato', 'emitidoEm', 'motivo', 'agenda', 'excluido', 'repId', 'repNome'].forEach(k => { if (c[k] !== undefined) lev[k] = c[k]; });
      continue;
    }
    const fotosLocais = {}; (local ? local.fotos : []).forEach(f => { if (f.data) fotosLocais[f.id] = f.data; });
    c.fotos = (c.fotos || []).map(f => ({ ...f, data: fotosLocais[f.id] || '', nuvem: true }));

}
async function sincronizar(puxar) {

  sincronizando = true; nuvem.estado = 'enviando'; pintaNuvem();
  let mudou = false;

    if (souGestor() && cfg.pendente) await enviarCfg();
    for (const l of levs.filter(x => x.pendente)) await enviarLev(l);
    if (puxar) mudou = await puxarNuvem();

    sincronizando = false; pintaNuvem();
    if (mudou && ['inicio', 'painel', 'reps', 'relatorios', 'empresa'].includes(view)) render();

const pendencias = () => levs.filter(l => l.pendente).length + (cfg.pendente && souGestor() ? 1 : 0);

function modal(titulo, texto, botoes, vertical) {
  return new Promise(res => {
    const fechar = v => { m.remove(); res(v); };
    const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) fechar(false); } },
      h('div', { class: 'box', role: 'dialog', 'aria-modal': 'true' },
        h('h3', null, titulo), texto ? h('p', null, texto) : null,
        h('div', { class: vertical ? 'col' : 'row', style: vertical ? '' : 'justify-content:flex-end' },
          botoes.map(b => h('button', { class: 'btn ' + (b.cls || ''), type: 'button', onclick: () => fechar(b.v) }, b.t)))));
    document.body.append(m);
  });
}
const aviso = (t, x) => modal(t, x, [{ t: 'Entendi', v: true, cls: 'pri' }]);
const confirma = (t, x, ok = 'Confirmar', cls = 'pri') => modal(t, x, [{ t: 'Cancelar', v: false }, { t: ok, v: true, cls }]);
// campos: [{k, rot, tipo, val, ph, opts, req, im}] — validar(vals) devolve texto de erro; aoConfirmar(vals) pode ser assíncrono e devolver erro
function formModal(titulo, texto, campos, okTxt = 'Salvar', validar, aoConfirmar) {
  return new Promise(res => {
    const els = {};
    const fechar = v => { m.remove(); res(v); };
    const corpo = campos.map(f => {
      let el;
      if (f.tipo === 'select') el = h('select', { id: 'fm_' + f.k }, f.opts.map(o => Array.isArray(o) ? h('option', { value: o[0], selected: o[0] === f.val }, o[1]) : h('option', { value: o, selected: o === f.val }, o)));
      else if (f.tipo === 'textarea') { el = h('textarea', { id: 'fm_' + f.k, placeholder: f.ph || '' }); el.value = f.val || ''; }
      else el = h('input', { type: f.tipo || 'text', id: 'fm_' + f.k, value: f.val ?? '', placeholder: f.ph || '', inputmode: f.im || null, autocomplete: f.tipo === 'password' ? 'new-password' : null });
      els[f.k] = el; return campo(f.rot, el);
    });
    const erro = h('p', { style: 'color:var(--bad);margin:0;font-weight:600', hidden: true, role: 'alert' });
    const okBtn = h('button', { type: 'submit', class: 'btn pri' }, okTxt);
    const ok = async () => {
      const vals = {};
      for (const f of campos) {
        vals[f.k] = els[f.k].value;
        if (f.req && !String(vals[f.k]).trim()) { erro.textContent = `Preencha: ${f.rot}`; erro.hidden = false; els[f.k].focus(); return; }
      }
      const msg = validar && validar(vals);
      if (msg) { erro.textContent = msg; erro.hidden = false; return; }
      if (aoConfirmar) {
        okBtn.disabled = true; okBtn.textContent = 'Aguarde…';
        const e2 = await aoConfirmar(vals);
        okBtn.disabled = false; okBtn.textContent = okTxt;
        if (e2) { erro.textContent = e2; erro.hidden = false; return; }
      }
      fechar(vals);
    };
    const m = h('div', { class: 'modal' }, h('form', { class: 'box', onsubmit: e => { e.preventDefault(); ok(); } },
      h('h3', null, titulo), texto ? h('p', null, texto) : null,
      h('div', { class: 'grid', style: 'grid-template-columns:1fr' }, corpo), erro,
      h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { type: 'button', class: 'btn', onclick: () => fechar(null) }, 'Cancelar'), okBtn)));
    document.body.append(m);
    const first = m.querySelector('input,select,textarea'); if (first) first.focus();
  });
}
function toast(msg) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2800); }
function setStatus(msg) { const s = document.getElementById('status'); if (s) s.textContent = msg; }

async function descobrirPapel(s) {
  sessao = Object.assign(s, { papel: 'config' });
  try {
    const d = await FB.req('GET', 'orc_config/principal');
    if (d && d.fields && d.fields.dados) {
      const c = JSON.parse(d.fields.dados.stringValue);
      if (String(c.gestorEmail || '').toLowerCase() === s.email) { cfg = c; ajustarCfg(); cfg.pendente = false; await DB.set('cfg', cfg); return 'gestor'; }
    }
  } catch (e) { if (e.status !== 403) throw e; }
  try {
    const r = await FB.req('GET', 'orc_reps/' + s.uid);
    if (r) { const o = deCampos(r.fields); if (o.ativo === true) { s.nome = o.nome; return 'rep'; } return 'inativo'; }
    return 'nada';
  } catch (e) { if (e.status === 403) return 'nada'; throw e; }
}
async function entrar(email, senha) {
  try {
    const s = novaSessao(await authPost('signInWithPassword', { email: email.trim(), password: senha, returnSecureToken: true }));
    const papel = await descobrirPapel(s);
    if (papel === 'gestor' || papel === 'rep') {
      sessao.papel = papel; gravarSessao();
      levs = ((await DB.all()) || []).map(migrar).filter(l => papel === 'gestor' || l.repId === sessao.uid || l.pendente);
      view = papel === 'gestor' ? 'painel' : 'inicio'; render(); topo(); sincronizar(true);
      toast('Bem-vindo' + (sessao.nome ? ', ' + sessao.nome.split(' ')[0] : ''));
      return null;
    }
    sessao = null;
    if (papel === 'inativo') return 'Seu acesso está desativado. Fale com o gestor.';
    return 'Esta conta não tem acesso ao sistema. Fale com o gestor.';
  } catch (e) { sessao = null; return e.status ? 'A nuvem recusou o acesso (' + e.status + '). Confira as regras do Firebase.' : msgAuth(e); }
}
async function forcarSaida(msg) {
  sessao = null; gravarSessao(); reps = []; view = 'login';
  try { await DB.set('reps', []); } catch (e) {}
  render(); topo(); if (msg) aviso('Faça login novamente', msg);
}
async function sair() {
  const n = pendencias();
  if (!await confirma('Sair deste aparelho?', n ? `Atenção: ${n} alteração(ões) ainda não chegaram à nuvem e serão perdidas se você sair agora. Conecte-se à internet e espere "Nuvem em dia".` : 'Os dados continuam salvos na nuvem. A cópia deste aparelho será apagada.', 'Sair', n ? 'danger' : 'pri')) return;
  await DB.limpar(); levs = []; reps = []; await DB.set('reps', []);
  sessao = null; gravarSessao(); view = 'login'; render(); topo();
}
async function esqueciSenha(emailPadrao) {

    async v => { try { await authPost('sendOobCode', { requestType: 'PASSWORD_RESET', email: v.email.trim() }); toast('Link enviado. Confira seu e-mail (e a caixa de spam).'); return null; } catch (e) { return msgAuth(e); } });

function pegarGPS(ms = 8000) {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    let feito = false; const fim = v => { if (!feito) { feito = true; res(v); } };
    setTimeout(() => fim(null), ms + 500);
    try {
      navigator.geolocation.getCurrentPosition(
        p => fim({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), prec: Math.round(p.coords.accuracy), em: Date.now() }),
        () => fim(null), { enableHighAccuracy: true, timeout: ms, maximumAge: 60000 });
    } catch (e) { fim(null); }
  });
}
const linkMapa = g => `https://www.google.com/maps?q=${g.lat},${g.lng}`;
const textoGPS = g => g ? `${String(g.lat).replace('.', ',')}; ${String(g.lng).replace('.', ',')} (±${g.prec} m)` : '';
function lerImagem(file, max, tipo, carimbo) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, hh = img.naturalHeight; const r = Math.min(1, max / Math.max(w, hh));
        w = Math.round(w * r); hh = Math.round(hh * r);
        const c = document.createElement('canvas'); c.width = w; c.height = hh;
        const ctx = c.getContext('2d');
        if (tipo === 'jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh); }
        ctx.drawImage(img, 0, 0, w, hh);
        if (carimbo && carimbo.length) {
          const fs = Math.max(13, Math.round(w / 46)), lh = fs * 1.35, pad = fs * .7, bh = carimbo.length * lh + pad * 2, barra = Math.max(4, fs / 3);
          ctx.fillStyle = 'rgba(10,10,12,.74)'; ctx.fillRect(0, hh - bh, w, bh);
          ctx.fillStyle = '#d4af37'; ctx.fillRect(0, hh - bh, barra, bh);
          ctx.textBaseline = 'top';
          carimbo.forEach((t, i) => { ctx.font = (i === 0 ? 'bold ' : '') + fs + 'px Arial, sans-serif'; ctx.fillStyle = i === 0 ? '#d4af37' : '#ffffff'; ctx.fillText(t, barra + pad, hh - bh + pad + i * lh, w - barra - pad * 2); });
        }
        res({ data: c.toDataURL(tipo === 'png' ? 'image/png' : 'image/jpeg', 0.72), w, h: hh });
      };
      img.onerror = () => rej(new Error('img'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}

function numerosRep(ls, mes) {
  const visitas = ls.filter(l => l.status === 'visitar');
  const abertos = ls.filter(l => ABERTO(l.status));
  const fechados = ls.filter(l => l.status === 'fechado');
  const perdidos = ls.filter(l => l.status === 'perdido');
  const fechMes = mes ? fechados.filter(l => mesDe(l.contrato.assinatura) === mes) : [];
  return {
    visitas: visitas.length, atrasadas: visitas.filter(l => l.agenda && diasAte(l.agenda) < 0).length,
    levant: ls.filter(l => l.status === 'levantamento').length, enviados: ls.filter(l => l.emitidoEm).length,
    enviadosMes: mes ? ls.filter(l => l.emitidoEm && mesDe(l.emitidoEm) === mes).length : 0,
    abertos: abertos.length, somaAbertos: abertos.reduce((s, l) => s + totais(l).tm, 0),
    fechados: fechados.length, somaFechados: fechados.reduce((s, l) => s + valorFechado(l), 0),
    fechMes: fechMes.length, valorMes: fechMes.reduce((s, l) => s + valorFechado(l), 0),
    perdidos: perdidos.length,
    taxa: fechados.length + perdidos.length ? Math.round(fechados.length / (fechados.length + perdidos.length) * 100) : null,
    ultima: ls.reduce((m, l) => Math.max(m, l.atualizadoEm || 0), 0)
  };
}

function painelTamanho() {
  const t = lev.tamanho, c = lev.cliente;

    const q = h('input', { type: 'number', min: '0', step: 'any', inputmode: 'decimal', id: 'tq_' + i.id, value: i.qtd, placeholder: '0', 'aria-label': 'Quantidade de ' + i.nome });
    const qBox = h('div', { class: 'tq', hidden: !i.sel }, q, h('span', null, i.un));
    const card = h('div', { class: 'tam' + (i.sel ? ' sel' : '') }, h('label', { for: 'tm_' + i.id }, cb, h('span', null, i.nome)), qBox,

  const pinta = () => { grade.replaceChildren(...itensTamanho(lev).map(cartao)); pintaResumo(); };

    h('div', { class: 'grid', style: 'align-items:end' },
      campo('Criar outro item', nome), campo('Medida', un),

    souGestor() ? h('label', { for: 'tmPadrao', class: 'row', style: 'font-size:.9rem;color:var(--muted);cursor:pointer' }, padrao, 'Guardar na lista padrão, para aparecer em todos os levantamentos') : null,
    campo('Observação sobre o tamanho', inp(c, 'unidades', { id: 'cUn', placeholder: 'Ex.: 2 entradas usadas só em dia de evento' }, () => salvar())));

async function gerarPDF(compartilhar) {
  if (!window.jspdf || !window.jspdf.jsPDF) { aviso('Sem conexão', 'O gerador de PDF não carregou. Conecte o aparelho à internet e abra o sistema de novo.'); return; }
  if (!lev.cliente.nome.trim()) { if (!await confirma('Cliente sem nome', 'O orçamento vai sair sem o nome do cliente. Gerar assim mesmo?', 'Gerar')) return; }
  setStatus('Gerando PDF…');
  if (lev.fotos.some(f => !f.data)) { toast('Buscando fotos na nuvem…'); if (!await garantirFotos(lev)) toast('Algumas fotos não foram encontradas e ficarão fora do PDF'); }
  if (lev.status === 'levantamento' || lev.status === 'visitar') {
    lev.status = 'enviado'; lev.emitidoEm = Date.now();
    lev.historico.push({ em: Date.now(), status: 'enviado', nota: `PDF gerado, validade de ${num(lev.orc.validade) || 15} dias` });
  } else if (!lev.emitidoEm) lev.emitidoEm = Date.now();
  await gravar(lev);
  let doc;
  try { doc = montarPDF(lev, cfg); }
  catch (e) { console.error(e); aviso('Erro ao gerar o PDF', 'Alguma foto ou o logo pode estar com problema. Tente remover a última foto adicionada.'); setStatus(''); return; }
  await entregarPDF(doc, `Orcamento_${lev.numero}${lev.cliente.nome ? '_' + slug(lev.cliente.nome) : ''}.pdf`, 'Orçamento ' + lev.numero, compartilhar);
  if (view !== 'editor') render();
}
async function entregarPDF(doc, nome, titulo, compartilhar) {
  if (compartilhar) {
    try {
      const file = new File([doc.output('blob')], nome, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: titulo }); setStatus('PDF enviado'); return; }
    } catch (e) { if (e && e.name === 'AbortError') { setStatus(''); return; } }
    toast('Este aparelho não permite enviar direto. O PDF foi baixado.');
  }
  doc.save(nome); setStatus('PDF gerado');
}
const COR_PDF = { NAVY: [10, 10, 12], AMBER: [212, 175, 55], INK: [20, 20, 22], GRAY: [100, 100, 108], LIGHT: [243, 240, 230] };

      doc.autoTable(Object.assign({
        startY: estado.y, margin: { left: M, right: M, top: 20, bottom: 18 },
        styles: { font: 'helvetica', fontSize: 9, textColor: INK, cellPadding: 2.2, lineColor: [215, 220, 226], lineWidth: 0.15 },
        headStyles: { fillColor: NAVY, textColor: AMBER, fontStyle: 'bold', fontSize: 8.5 },
        alternateRowStyles: { fillColor: [248, 249, 251] }
      }, opts));
      estado.y = doc.lastAutoTable.finalY + 7;
    }
  };
}
function montarPDF(l, cf) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const { NAVY, AMBER, INK, GRAY, LIGHT } = COR_PDF, W = 210, M = 14, CW = W - 2 * M;
  const COR = { bom: [31, 138, 76], reparo: [184, 110, 0], nao: [192, 57, 43] };
  const e = cf.empresa, c = l.cliente, t = totais(l);
  const repNome = nomeRep(l) || e.representante || '';
  const emissao = l.emitidoEm ? new Date(l.emitidoEm) : new Date();
  cabecalhoPDF(doc, cf, 'ORÇAMENTO', l.numero, 'Emitido em ' + emissao.toLocaleDateString('pt-BR'));
  const st = { y: 42 }; const { precisa, secao, paragrafo, tabela } = ferramentasPDF(doc, st);

  secao('Dados do cliente');
  tabela({
    theme: 'grid', showHead: false,
    columnStyles: { 0: { fontStyle: 'bold', fillColor: LIGHT, cellWidth: 32 }, 2: { fontStyle: 'bold', fillColor: LIGHT, cellWidth: 30 } },
    body: [
      ['Cliente', { content: c.nome || '—', colSpan: 3 }],
      ['Tipo de local', c.tipo || '—', 'Data da visita', fmtData(c.dataVisita) || '—'],
      ['Responsável', c.responsavel || '—', 'Telefone', c.telefone || '—'],
      ['E-mail', c.email || '—', 'Representante', repNome || '—'],
      ['Endereço', { content: c.endereco || '—', colSpan: 3 }],
      (tamanhoTexto(l) || c.unidades) ? ['Tamanho do local', { content: [tamanhoTexto(l, '\n'), c.unidades].filter(Boolean).join('\n'), colSpan: 3 }] : null,
      l.gps ? ['Local da visita', { content: `${textoGPS(l.gps)} · registrado em ${fmtMomento(l.gps.em)}`, colSpan: 3 }] : null
    ].filter(Boolean)
  });
  if (c.observacoes && c.observacoes.trim()) { secao('Necessidade relatada pelo cliente'); paragrafo(c.observacoes); }

  secao('Serviços propostos');
  if (t.its.length) {
    const body = [];
    const grupo = (rot, mensal) => {
      const its = t.its.filter(i => (i.tipo === 'mensal') === mensal); if (!its.length) return;
      body.push([{ content: rot, colSpan: 5, styles: { fontStyle: 'bold', fillColor: LIGHT, textColor: [140, 110, 20] } }]);
      its.forEach(i => body.push([i.nome + (i.obs ? '\n' + i.obs : ''), String(i.qtd), i.unidade, fmtNum(i.preco), fmtNum(i.qtd * i.preco)]));
    };
    grupo('Serviços mensais', true); grupo('Serviços avulsos (pagamento único)', false);
    tabela({ theme: 'grid', head: [['Serviço', 'Qtd', 'Unidade', 'Valor unit. (R$)', 'Total (R$)']], body,
      columnStyles: { 1: { halign: 'center', cellWidth: 14 }, 2: { cellWidth: 24 }, 3: { halign: 'right', cellWidth: 30 }, 4: { halign: 'right', cellWidth: 30 } } });
    const linhas = [];
    if (t.sm) { linhas.push(['Subtotal mensal', brl(t.sm)]); if (t.dm) linhas.push([`Desconto (${fmtNum(t.dpct)}%)`, '- ' + brl(t.dm)]); }
    if (t.sa) { linhas.push(['Subtotal avulso', brl(t.sa)]); if (t.da) linhas.push([`Desconto (${fmtNum(t.dpct)}%)`, '- ' + brl(t.da)]); linhas.push(['Total avulso', brl(t.ta)]); }
    precisa(linhas.length * 5.5 + 18);
    const bx = W - M - 80;
    doc.setFontSize(9.5); doc.setTextColor(...INK);
    linhas.forEach(([a, b]) => { doc.setFont('helvetica', a.startsWith('Total') ? 'bold' : 'normal'); doc.text(a, bx, st.y); doc.text(b, W - M, st.y, { align: 'right' }); st.y += 5.5; });
    doc.setFillColor(...NAVY); doc.rect(bx - 3, st.y - 1, 83, 11, 'F');
    doc.setFillColor(...AMBER); doc.rect(bx - 3, st.y - 1, 1.6, 11, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.text('TOTAL MENSAL', bx + 1, st.y + 6);
    doc.setTextColor(...AMBER); doc.setFontSize(13); doc.text(brl(t.tm), W - M - 2, st.y + 6.3, { align: 'right' });
    st.y += 17;
  } else paragrafo('Nenhum serviço selecionado.');

  const est = ESTRUTURA.filter(([id]) => l.estrutura[id] && l.estrutura[id].status);
  if (est.length || (l.obsLocal && l.obsLocal.trim())) {
    secao('Levantamento do local');
    if (est.length) tabela({
      theme: 'grid', head: [['Item', 'Situação', 'Qtd', 'Observação']],
      body: est.map(([id, nome]) => { const s = l.estrutura[id]; return [nome, SITUACAO[s.status], s.qtd ? String(s.qtd) : '', s.obs || '']; }),
      columnStyles: { 0: { cellWidth: 58 }, 1: { cellWidth: 40, fontStyle: 'bold' }, 2: { halign: 'center', cellWidth: 12 } },
      didParseCell: d => { if (d.section === 'body' && d.column.index === 1) { const k = Object.keys(SITUACAO).find(k => SITUACAO[k] === d.cell.raw); if (k) d.cell.styles.textColor = COR[k]; } }
    });
    if (l.obsLocal && l.obsLocal.trim()) { precisa(12); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...NAVY); doc.text('Riscos e pontos de atenção', M, st.y); st.y += 5; paragrafo(l.obsLocal); }
  }

  const fotos = l.fotos.filter(f => f.data);
  if (fotos.length) {
    secao('Registro fotográfico');
    const gap = 6, cw = (CW - gap) / 2, maxH = 64;
    for (let i = 0; i < fotos.length; i += 2) {
      const par = fotos.slice(i, i + 2).map((f, k) => {
        const r = (f.w || 4) / (f.h || 3); let iw = cw, ih = iw / r; if (ih > maxH) { ih = maxH; iw = ih * r; }
        doc.setFontSize(8.5);
        return { f, iw, ih, leg: doc.splitTextToSize(`Foto ${i + k + 1}${f.legenda ? ' – ' + f.legenda : ''}`, cw) };
      });
      precisa(maxH + 6 + Math.max(...par.map(p => p.leg.length)) * 3.8);
      par.forEach((p, k) => {
        const x0 = M + k * (cw + gap);
        doc.setFillColor(...LIGHT); doc.rect(x0, st.y, cw, maxH, 'F');
        doc.addImage(p.f.data, 'JPEG', x0 + (cw - p.iw) / 2, st.y + (maxH - p.ih) / 2, p.iw, p.ih, undefined, 'FAST');
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...GRAY); doc.text(p.leg, x0, st.y + maxH + 4);
      });
      st.y += maxH + 4 + Math.max(...par.map(p => p.leg.length)) * 3.8 + 4;
    }
    st.y += 2;
  }

  const o = l.orc;
  secao('Condições da proposta');
  const dias = num(o.validade) || 15;
  tabela({ theme: 'grid', showHead: false, columnStyles: { 0: { fontStyle: 'bold', fillColor: LIGHT, cellWidth: 42 } },
    body: [
      ['Validade da proposta', `${dias} dias (até ${new Date(emissao.getTime() + dias * DIA).toLocaleDateString('pt-BR')})`],
      o.inicio ? ['Início previsto', o.inicio] : null, o.pagamento ? ['Forma de pagamento', o.pagamento] : null, o.observacoes ? ['Observações', o.observacoes] : null
    ].filter(Boolean) });

  // assinaturas
  const sig = l.assinatura;
  precisa(sig ? 52 : 34); st.y += sig ? 30 : 16;
  const sw = (CW - 20) / 2, xc = M + sw + 20;
  if (sig) { try { doc.addImage(sig.data, 'PNG', xc + sw / 2 - 30, st.y - 26, 60, 20); } catch (x) {} }
  doc.setDrawColor(...INK); doc.setLineWidth(0.3); doc.line(M, st.y, M + sw, st.y); doc.line(xc, st.y, W - M, st.y);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text(repNome || 'Representante', M + sw / 2, st.y + 4.5, { align: 'center' });
  doc.text(sig ? sig.nome : (c.responsavel || 'Cliente'), xc + sw / 2, st.y + 4.5, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...GRAY);
  doc.text(e.nome || '', M + sw / 2, st.y + 8.5, { align: 'center' });
  doc.text(c.nome || '', xc + sw / 2, st.y + 8.5, { align: 'center' });
  if (sig) { doc.setFontSize(7); doc.text(`Assinado na tela em ${fmtMomento(sig.em)}${sig.gps ? ' · ' + textoGPS(sig.gps) : ''}`, xc + sw / 2, st.y + 12, { align: 'center' }); }
  rodapePDF(doc, cf, l.numero);
  return doc;
}

// =========================================================
// 18. Contrato em PDF
// =========================================================
async function gerarContrato(l, jaPreenchido) {
  if (!window.jspdf || !window.jspdf.jsPDF) { aviso('Sem conexão', 'O gerador de PDF não carregou. Conecte o aparelho à internet.'); return; }
  const k = l.contrato;
  if (!jaPreenchido || !k.doc) { const v = await formContrato(l, 'Dados do contrato'); if (!v) return; await gravar(l); }
  try { const doc = montarContrato(l, cfg); await entregarPDF(doc, `Contrato_${l.numero.replace('ORC', 'CTR')}${l.cliente.nome ? '_' + slug(l.cliente.nome) : ''}.pdf`, 'Contrato ' + l.cliente.nome, false); }
  catch (e) { console.error(e); aviso('Erro ao gerar o contrato', 'Confira os dados do contrato e tente de novo.'); }
}
function montarContrato(l, cf) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const { NAVY, INK, GRAY, LIGHT } = COR_PDF, W = 210, M = 14, CW = W - 2 * M;
  const e = cf.empresa, c = l.cliente, k = l.contrato, t = totais(l);
  const numero = l.numero.replace('ORC', 'CTR');
  cabecalhoPDF(doc, cf, 'CONTRATO', numero, 'Assinatura ' + fmtData(k.assinatura || hojeISO()));
  const st = { y: 44 }; const { precisa, secao, paragrafo, tabela } = ferramentasPDF(doc, st);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...NAVY);
  doc.text('CONTRATO DE PRESTAÇÃO DE SERVIÇOS', W / 2, st.y, { align: 'center' }); st.y += 10;
  const valor = valorFechado(l);
  const subst = s => s.replace(/\{ENDERECO\}/g, k.endereco || c.endereco || '—').replace(/\{VALOR\}/g, brl(valor)).replace(/\{VALOR_EXTENSO\}/g, extenso(valor))
    .replace(/\{VENCIMENTO\}/g, String(k.vencimento || 10)).replace(/\{MESES\}/g, String(k.meses || 12)).replace(/\{INICIO\}/g, fmtData(k.inicio) || '—')
    .replace(/\{CIDADE\}/g, e.cidade || 'Goiânia - GO').replace(/\{CONTRATANTE\}/g, c.nome || '—').replace(/\{CONTRATADA\}/g, e.nome || '—');
  secao('Das partes');
  paragrafo(`CONTRATADA: ${e.nome || '—'}${e.cnpj ? ', inscrita no CNPJ sob o nº ' + e.cnpj : ''}${e.endereco ? ', com sede em ' + e.endereco : ''}${e.representante ? ', neste ato representada por ' + e.representante : ''}.`);
  paragrafo(`CONTRATANTE: ${c.nome || '—'}${k.doc ? ', inscrito(a) no CPF/CNPJ sob o nº ' + k.doc : ''}${c.endereco ? ', com endereço em ' + c.endereco : ''}${k.repLegal ? ', neste ato representado(a) por ' + k.repLegal : ''}.`);
  paragrafo('As partes acima identificadas têm entre si, justo e contratado, o presente Contrato de Prestação de Serviços, que se regerá pelas cláusulas e condições seguintes.');
  secao('Cláusulas');
  subst(cf.clausulas || CLAUSULAS_PADRAO).split(/\n\s*\n/).forEach(bloco => {
    const ls = bloco.trim().split('\n'); if (!ls[0]) return;
    if (/^CL[ÁA]USULA/i.test(ls[0])) { precisa(14); paragrafo(ls.shift(), 9.5, true); }
    ls.forEach(x => x.trim() && paragrafo(x.trim()));
  });
  secao('Anexo I · Serviços contratados');
  const its = t.its;
  tabela({ theme: 'grid', head: [['Serviço', 'Qtd', 'Unidade', 'Cobrança']],
    body: its.length ? its.map(i => [i.nome + (i.obs ? '\n' + i.obs : ''), String(i.qtd), i.unidade, i.tipo === 'mensal' ? 'Mensal' : 'Avulso']) : [[{ content: 'Conforme proposta ' + l.numero, colSpan: 4 }]],
    columnStyles: { 1: { halign: 'center', cellWidth: 14 }, 2: { cellWidth: 28 }, 3: { cellWidth: 26 } } });
  tabela({ theme: 'grid', showHead: false, columnStyles: { 0: { fontStyle: 'bold', fillColor: LIGHT, cellWidth: 60 } },
    body: [['Valor mensal', `${brl(valor)} (${extenso(valor)})`], t.ta ? ['Serviços avulsos', brl(t.ta) + ' (pagamento único)'] : null,
      ['Vencimento', `Todo dia ${k.vencimento || 10}`], ['Vigência', `${k.meses || 12} meses a partir de ${fmtData(k.inicio) || '—'}`], ['Proposta de origem', l.numero]].filter(Boolean) });
  precisa(20); paragrafo(`E, por estarem assim justas e contratadas, as partes assinam o presente instrumento em duas vias de igual teor, na presença das testemunhas abaixo.`);
  paragrafo(`${e.cidade || 'Goiânia - GO'}, ${dataExtenso(k.assinatura ? new Date(k.assinatura + 'T12:00:00') : new Date())}.`);
  const sw = (CW - 20) / 2, xc = M + sw + 20;
  const assin = (x, nome, sub) => { doc.setDrawColor(...INK); doc.setLineWidth(0.3); doc.line(x, st.y, x + sw, st.y); doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(nome, x + sw / 2, st.y + 4.5, { align: 'center' }); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...GRAY); doc.text(sub, x + sw / 2, st.y + 8.5, { align: 'center' }); };
  precisa(34); st.y += 18;
  assin(M, e.representante || e.nome || 'Contratada', 'CONTRATADA · ' + (e.nome || '')); assin(xc, k.repLegal || c.responsavel || c.nome || 'Contratante', 'CONTRATANTE · ' + (c.nome || ''));
  precisa(30); st.y += 26;
  assin(M, 'Testemunha 1', 'Nome e CPF'); assin(xc, 'Testemunha 2', 'Nome e CPF');
  rodapePDF(doc, cf, numero);
  return doc;
}

// 19. Início
// =========================================================
(async () => {
  await DB.open();
  try { const c = await DB.get('cfg'); if (c) cfg = c; } catch (e) {}
  ajustarCfg();
  try { reps = (await DB.get('reps')) || []; } catch (e) { reps = []; }
  sessao = lerSessao();
  if (sessao && sessao.papel === 'config') view = 'setup';
  else if (sessao && (sessao.papel === 'gestor' || sessao.papel === 'rep')) {
    try { levs = ((await DB.all()) || []).map(migrar); } catch (e) { levs = []; }
    view = souGestor() ? 'painel' : 'inicio';
  } else { sessao = null; view = pedeConfig() ? 'setup' : 'login'; }
  window.addEventListener('hashchange', () => { if (pedeConfig() && !sessao) { view = 'setup'; render(); topo(); } });
  render();
  sincronizar(true);
  setInterval(() => sincronizar(true), 60000);
  window.addEventListener('online', () => sincronizar(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(true); });
})();
